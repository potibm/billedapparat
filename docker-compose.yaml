services:
  # --------------------------------------------------------
  # Traefik Reverse Proxy
  # --------------------------------------------------------
  traefik:
    image: traefik:v3.7
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--providers.file.filename=/etc/traefik/dynamic.yaml"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/.certs:/certs:ro
      - ./infra/traefik-dynamic.yaml:/etc/traefik/dynamic.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --------------------------------------------------------
  # Identity
  # --------------------------------------------------------
  dex:
    image: ghcr.io/dexidp/dex:v2.38.0
    volumes:
      - ./infra/dex-config.yaml:/etc/dex/config.docker.yaml
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dex.rule=Host(`dex.billedapparat.test`)"
      - "traefik.http.routers.dex.entrypoints=websecure"
      - "traefik.http.routers.dex.tls=true"
      - "traefik.http.services.dex.loadbalancer.server.port=5556"

  # --------------------------------------------------------
  # Observability
  # --------------------------------------------------------
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    environment:
      - ZO_ROOT_USER_EMAIL=admin@example.com
      - ZO_ROOT_USER_PASSWORD=password123
    volumes:
      - o2_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.observe.rule=Host(`observe.billedapparat.test`)"
      - "traefik.http.routers.observe.entrypoints=websecure"
      - "traefik.http.routers.observe.tls=true"
      - "traefik.http.services.observe.loadbalancer.server.port=5080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./infra/otel-config.yaml:/etc/otel/config.yaml
      - ./backend/logs:/etc/app/logs:ro
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "3117:4317" # OTLP gRPC (Needed for Go backend on host)
      - "3118:4318" # OTLP HTTP (Needed for Vite frontend on host)
    depends_on:
      - openobserve

  # --------------------------------------------------------
  # Data Stores
  # --------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: billedapparat_redis
    ports:
      - "3151:6379" # Needed for Go backend on host
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  redisinsight:
    image: redis/redisinsight:latest
    container_name: billedapparat_redisinsight
    environment:
      - RI_APP_PORT=5540
      - RI_APP_HOST=0.0.0.0
      - RI_ACCEPT_TERMS_AND_CONDITIONS=true
      - RI_REDIS_ALIAS0=Billedapparat-Redis
      - RI_REDIS_HOST0=billedapparat_redis
      - RI_REDIS_PORT0=6379
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redis.rule=Host(`redis.billedapparat.test`)"
      - "traefik.http.routers.redis.entrypoints=websecure"
      - "traefik.http.routers.redis.tls=true"
      - "traefik.http.services.redis.loadbalancer.server.port=5540"

  funkapparat-seed:
    image: ghcr.io/potibm/funkapparat:latest
    container_name: billedapparat_funkapparat_seed
    command: database reset --force --seed
    volumes:
      - ./infra/funkapparat:/app/config
      - funkapparat_data:/app/data

  funkapparat:
    image: ghcr.io/potibm/funkapparat:latest
    container_name: billedapparat_funkapparat
    ports:
      - "3110:3200"
    volumes:
      - ./infra/funkapparat:/app/config
      - funkapparat_data:/app/data
    command: serve --otel-endpoint=otel-collector:4317
    depends_on:
      funkapparat-seed:
        condition: service_completed_successfully
      redis:
        condition: service_started
      otel-collector:
        condition: service_started

  tidsapparat-seed:
    image: ghcr.io/potibm/tidsapparat:latest
    container_name: billedapparat_tidsapparat_seed
    command: database reset --force --seed
    volumes:
      - ./infra/tidsapparat:/app/config
      - tidsapparat_data:/app/data

  tidsapparat:
    image: ghcr.io/potibm/tidsapparat:latest
    container_name: billedapparat_tidsapparat
    ports:
      - "3120:3200"
    volumes:
      - ./infra/tidsapparat:/app/config
      - tidsapparat_data:/app/data
    command: serve --otel-endpoint=otel-collector:4317
    depends_on:
      tidsapparat-seed:
        condition: service_completed_successfully
      redis:
        condition: service_started
      otel-collector:
        condition: service_started

volumes:
  o2_data:
  redis_data:
  redisinsight_data:
  funkapparat_data:
  tidsapparat_data:
