services:
  # Monitoring & logging backend
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    environment:
      - ZO_ROOT_USER_EMAIL=admin@example.com
      - ZO_ROOT_USER_PASSWORD=password123
    ports:
      - "3105:5080" # Web UI
    volumes:
      - o2_data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./infra/otel-config.yaml:/etc/otel/config.yaml
      - ./backend/logs:/etc/app/logs:ro
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "3117:4317" # OTLP gRPC
      - "3118:4318" # OTLP HTTP
    depends_on:
      - openobserve

  redis:
    image: redis:7-alpine
    container_name: billedapparat_redis
    ports:
      - "3151:6379"
    volumes:
      - redis_data:/data
    # Saves every 60 seconds if at least 1 key changes
    command: redis-server --save 60 1 --loglevel warning

  redisinsight:
    image: redis/redisinsight:latest
    container_name: billedapparat_redisinsight
    environment:
      - RI_APP_PORT=5540
      - RI_APP_HOST=0.0.0.0
      - RI_ACCEPT_TERMS_AND_CONDITIONS=true
      - RI_REDIS_ALIAS0=Billedapparat-Redis
      - RI_REDIS_HOST0=billedapparat_redis
      - RI_REDIS_PORT0=6379
    ports:
      - "3106:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis

  funkapparat-seed:
    image: ghcr.io/potibm/funkapparat:latest
    container_name: billedapparat_funkapparat_seed
    command: database reset --force --seed
    volumes:
      - ./infra/funkapparat:/app/config
      - funkapparat_data:/app/data

  funkapparat:
    image: ghcr.io/potibm/funkapparat:latest
    container_name: billedapparat_funkapparat
    ports:
      - "3110:3200"
    volumes:
      - ./infra/funkapparat:/app/config
      - funkapparat_data:/app/data
    command: serve --otel-endpoint=otel-collector:4317
    depends_on:
      funkapparat-seed:
        condition: service_completed_successfully
      redis:
        condition: service_started
      otel-collector:
        condition: service_started

  tidsapparat-seed:
    image: ghcr.io/potibm/tidsapparat:latest
    container_name: billedapparat_tidsapparat_seed
    command: database reset --force --seed
    volumes:
      - ./infra/tidsapparat:/app/config
      - tidsapparat_data:/app/data

  tidsapparat:
    image: ghcr.io/potibm/tidsapparat:latest
    container_name: billedapparat_tidsapparat
    ports:
      - "3120:3200"
    volumes:
      - ./infra/tidsapparat:/app/config
      - tidsapparat_data:/app/data
    command: serve --otel-endpoint=otel-collector:4317
    depends_on:
      tidsapparat-seed:
        condition: service_completed_successfully
      redis:
        condition: service_started
      otel-collector:
        condition: service_started

volumes:
  o2_data:
  redis_data:
  redisinsight_data:
  funkapparat_data:
  tidsapparat_data:
