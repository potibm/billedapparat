app:
    cors_allow_origins: https://localhost:3320
    db_filename: tidsapparat
    frontend_url: "https://localhost:3320"
    log_format: json
    log_level: debug
    version: dev
    redis_url: redis://billedapparat_redis:6379/0

sentry:
    dsn: ""
    environment: development
    replay_error_sample_rate: 0.1
    replay_session_sample_rate: 0.1
    trace_sample_rate: 0.1

format:
    date:
        locale: da-DK
        options:
            hour: 2-digit
            minute: 2-digit
            weekday: short

party:
    default_address: Prins Jørgens Gård 5, 1218 København K, Denmark
    timezone: Europe/Copenhagen

event_durations:
    - 0
    - 15
    - 30
    - 60
    - 90
    - 120  